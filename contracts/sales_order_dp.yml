table: sales_order
layer: data_product
catalog: sap_bdc_sim
schema: data_products
description: >
  Ordens de venda curadas publicadas via Delta Sharing (simulação BDC).
  Fonte: sap_lab_<env>.gold.fact_sales_order_item + dim_customer + dim_material.
  Sem campos técnicos SAP — expõe apenas atributos de negócio.

primary_key:
  - order_id
  - item_number

schema:
  - name: order_id
    type: STRING
    nullable: false
    sap_field: VBELN
    description: "Número da ordem de venda."
  - name: item_number
    type: STRING
    nullable: false
    sap_field: POSNR
    description: "Número do item da ordem."
  - name: order_date
    type: DATE
    nullable: true
    sap_field: AUDAT
    description: "Data de criação da ordem. NULL se data SAP era 00000000."
  - name: customer_id
    type: STRING
    nullable: true
    sap_field: KUNNR
    description: "Número do cliente (formato com zeros à esquerda)."
  - name: customer_name
    type: STRING
    nullable: true
    sap_field: NAME1
    description: "Razão social do cliente."
  - name: material_id
    type: STRING
    nullable: true
    sap_field: MATNR
    description: "Número do material."
  - name: material_desc
    type: STRING
    nullable: true
    sap_field: MAKTX
    description: "Descrição do material em português (SPRAS=P)."
  - name: quantity
    type: DECIMAL(18,3)
    nullable: true
    sap_field: MENGE
    description: "Quantidade do item."
  - name: uom
    type: STRING
    nullable: true
    sap_field: MEINS
    description: "Unidade de medida."
  - name: net_value
    type: DECIMAL(18,2)
    nullable: true
    sap_field: NETWR
    description: "Valor líquido na moeda original."
  - name: currency
    type: STRING
    nullable: true
    sap_field: WAERK
    description: "Moeda original (BRL, USD, EUR)."
  - name: net_value_brl
    type: DECIMAL(18,2)
    nullable: true
    description: "Valor convertido para BRL via TCURR (KURST=M). NULL se taxa não encontrada."
  - name: sales_org
    type: STRING
    nullable: true
    sap_field: VKORG
    description: "Organização de vendas."
  - name: published_at
    type: TIMESTAMP
    nullable: false
    description: "Timestamp da última publicação neste data product."

quality_rules:
  - id: no_mandt_column
    description: "MANDT não deve existir como coluna — é campo técnico SAP sem significado fora do sistema."
  - id: no_cdc_columns
    description: "Colunas _op, _seq, is_deleted, deleted_at não devem existir no data product."
  - id: order_id_not_null
    expression: "order_id IS NOT NULL AND LENGTH(TRIM(order_id)) > 0"
  - id: item_number_not_null
    expression: "item_number IS NOT NULL AND LENGTH(TRIM(item_number)) > 0"
  - id: net_value_non_negative
    expression: "net_value IS NULL OR net_value >= 0"
    description: "Valor líquido de item de ordem de venda é sempre >= 0."
  - id: published_at_not_null
    expression: "published_at IS NOT NULL"
  - id: key_unique
    expression: "COUNT(*) = COUNT(DISTINCT CONCAT(order_id, '|', item_number))"
    description: "Chave (order_id, item_number) deve ser única."
